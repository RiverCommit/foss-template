[project]
name = "foss-template"
version = "0.1.0"
description = "Reusable supply-chain-transparent FOSS project template. Offline, no telemetry."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RiverCommit" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.165.2",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foss_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
